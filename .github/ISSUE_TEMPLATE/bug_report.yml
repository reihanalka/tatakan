name: Bug report
description: Something in Tatakan doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! English or Bahasa Indonesia are both fine.
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options: [Shelf, Nook / notch panel (Mac), Now Playing (Mac), Calendar / Timer / Notes (Mac), Mirror (Mac), Tray icon (Windows), Install / won't open, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you were doing and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: e.g. macOS 27.0, Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: mac
    attributes:
      label: Device
      options: [Mac — Apple Silicon with notch, Mac — Apple Silicon without notch, Mac — Intel, Mac — external display, Windows PC (x64), Windows PC (ARM64)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tatakan version
      placeholder: e.g. 0.4.0
  - type: textarea
    id: media
    attributes:
      label: Screenshots, a screen recording or error.log
      description: On Windows, drag in %LOCALAPPDATA%\Tatakan\error.log if it exists.
