name: Release

# Push a tag like v0.4.0 → builds on clean runners and attaches to the GitHub release:
#   macOS   Tatakan-<ver>.pkg / .dmg / .zip + SHA256SUMS.txt          (Apple Silicon + Intel)
#   Windows Tatakan-Setup-<ver>.exe + SHA256SUMS-windows.txt          (x64 + ARM64, no notch features)
# Tatakan/Info.plist must carry the tag's version. The Windows job only builds when
# windows/Tatakan/Tatakan.csproj carries it too, so a Mac-only release (e.g. v0.5.0) is fine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Tatakan/Info.plist)
          [ "v$VER" = "${GITHUB_REF_NAME}" ] || { echo "::error::Info.plist is $VER but tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build release files
        run: ./scripts/make-release.sh

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Tatakan ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: tatakan-mac
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Is this a Windows release too?
        id: ver
        shell: pwsh
        run: |
          [xml]$p = Get-Content windows\Tatakan\Tatakan.csproj
          $v = $p.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $build = (-not $env:GITHUB_REF_NAME.StartsWith('v')) -or ("v$v" -eq $env:GITHUB_REF_NAME)
          if (-not $build) { Write-Host "::notice::Tatakan.csproj is $v, tag is $env:GITHUB_REF_NAME: Mac-only release, Windows skipped." }
          "build=$($build.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Build app (x64 + arm64) and installer
        if: steps.ver.outputs.build == 'true'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          .\windows\build.ps1
          $lines = Get-ChildItem windows\dist\Tatakan-Setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          # LF line endings so `shasum -c` / `sha256sum -c` work on macOS and Linux too.
          [IO.File]::WriteAllText("$PWD\windows\dist\SHA256SUMS-windows.txt", (($lines -join "`n") + "`n"))

      - name: Upload to release
        if: steps.ver.outputs.build == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            [ $i = 1 ] && gh release create "$GITHUB_REF_NAME" --title "Tatakan ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md" 2>/dev/null && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" windows/dist/Tatakan-Setup-*.exe windows/dist/SHA256SUMS-windows.txt --clobber

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.build == 'true'
        with:
          name: tatakan-windows
          path: |
            windows/dist/Tatakan-Setup-*.exe
            windows/dist/SHA256SUMS-windows.txt
