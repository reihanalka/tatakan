name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: UNIVERSAL=1 SIGN=- ./Tatakan/build.sh

      - name: Check both architectures
        run: |
          lipo -info Tatakan/build/Tatakan.app/Contents/MacOS/Tatakan
          lipo Tatakan/build/Tatakan.app/Contents/MacOS/Tatakan -verify_arch arm64 x86_64

      - name: Installer scripts parse
        run: bash -n scripts/install.sh scripts/make-release.sh installer/scripts/preinstall installer/scripts/postinstall
