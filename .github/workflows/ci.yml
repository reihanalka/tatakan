name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: UNIVERSAL=1 SIGN=- ./Tatakan/build.sh

      - name: Check both architectures
        run: |
          lipo -info Tatakan/build/Tatakan.app/Contents/MacOS/Tatakan
          lipo Tatakan/build/Tatakan.app/Contents/MacOS/Tatakan -verify_arch arm64 x86_64

      - name: Installer scripts parse
        run: bash -n scripts/install.sh scripts/make-release.sh installer/scripts/preinstall installer/scripts/postinstall

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build app (x64 + arm64) and installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          .\windows\build.ps1

      - name: Silent install
        shell: pwsh
        run: |
          $setup = Get-ChildItem windows\dist\Tatakan-Setup-*.exe | Select-Object -First 1
          $log = Join-Path $env:RUNNER_TEMP 'tatakan-setup.log'
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/LOG=`"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "setup exit $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Tatakan\Tatakan.exe'
          if (-not (Test-Path $exe)) { $exe = Join-Path $env:ProgramFiles 'Tatakan\Tatakan.exe' }
          if (-not (Test-Path $exe)) { throw 'Tatakan.exe not installed' }
          "TATAKAN_EXE=$exe" >> $env:GITHUB_ENV

      - name: Run and take screenshots
        shell: pwsh
        run: .\windows\tools\smoke.ps1 -Exe $env:TATAKAN_EXE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: |
            windows/dist/Tatakan-Setup-*.exe
            windows/dist/screens/
